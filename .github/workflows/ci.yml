name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the development toolchain (see docs/ci.md).
  RUSTUP_TOOLCHAIN: "1.94.0"

jobs:
  moon-check:
    name: moon-check-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, js]
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions
        run: moon version --all
      - name: moon check
        run: moon check --target ${{ matrix.target }}

  moon-test:
    name: moon-test-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, js]
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions
        run: moon version --all
      - name: moon test
        run: moon test --target ${{ matrix.target }}

  moon-fmt:
    name: moon-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check formatting (no diff allowed)
        run: moon fmt --check

  moon-info:
    name: moon-info (public API diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate .mbti and require no diff
        run: |
          moon info
          if ! git diff --exit-code -- '*.mbti'; then
            echo "::error::Public API (.mbti) changed. Review the diff and commit the regenerated files."
            exit 1
          fi

  oracle:
    name: oracle (pinned Rust golden check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show && cargo --version
      - name: Cache cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/oracle/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Oracle unit tests
        working-directory: tools/oracle
        run: cargo test
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify fixture hashes and golden determinism
        run: moon run tools/oracle/regenerate_fixtures.mbtx -- --check
      - name: Regenerate oracle case tables
        working-directory: tools/oracle
        run: |
          cargo run --quiet -- box-headers --moonbit > ../../src/box/box_header_oracle_cases_test.mbt
          cargo run --quiet -- box-tree-cases --moonbit > ../../src/boxes/box_tree_oracle_cases_test.mbt
          cargo run --quiet -- box-tree-fixtures --moonbit > ../../src/boxes/box_tree_oracle_fixtures_test.mbt
          cargo run --quiet -- moov-tree-cases --moonbit > ../../src/boxes/moov_tree_oracle_cases_test.mbt
          cargo run --quiet -- moov-tree-fixtures --moonbit > ../../src/boxes/moov_tree_oracle_fixtures_test.mbt
          cargo run --quiet -- sample-tables-cases --moonbit > ../../src/boxes/sample_table_oracle_cases_test.mbt
          cargo run --quiet -- sample-tables-fixtures --moonbit > ../../src/boxes/sample_table_oracle_fixtures_test.mbt
          cargo run --quiet -- codec-strings-cases --moonbit > ../../src/codec_string/codec_string_oracle_cases_test.mbt
          cargo run --quiet -- kind-detector-cases --moonbit > ../../src/demux/kind_detector_oracle_cases_test.mbt
          cargo run --quiet -- demux-cases --moonbit > ../../src/demux/mp4_file_demux_oracle_cases_test.mbt
      - name: Verify generated oracle tables are current and formatted
        run: |
          moon fmt
          git diff --exit-code -- \
            src/box/box_header_oracle_cases_test.mbt \
            src/boxes/box_tree_oracle_cases_test.mbt \
            src/boxes/box_tree_oracle_fixtures_test.mbt \
            src/boxes/moov_tree_oracle_cases_test.mbt \
            src/boxes/moov_tree_oracle_fixtures_test.mbt \
            src/boxes/sample_table_oracle_cases_test.mbt \
            src/boxes/sample_table_oracle_fixtures_test.mbt \
            src/codec_string/codec_string_oracle_cases_test.mbt \
            src/demux/kind_detector_oracle_cases_test.mbt \
            src/demux/mp4_file_demux_oracle_cases_test.mbt
          printf 'generated oracle tables are in sync (box-headers: %s cases, box-tree: %s cases, box-tree fixtures: %s, moov-tree: %s cases, moov-tree fixtures: %s, sample-tables: %s cases, sample-tables fixtures: %s, codec-strings: %s cases, kind-detector: %s cases, demux: %s cases)\n' \
            "$(grep -c '    name: ' src/box/box_header_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/box_tree_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/box_tree_oracle_fixtures_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/moov_tree_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/moov_tree_oracle_fixtures_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/sample_table_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/boxes/sample_table_oracle_fixtures_test.mbt)" \
            "$(grep -c '    name: ' src/codec_string/codec_string_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/demux/kind_detector_oracle_cases_test.mbt)" \
            "$(grep -c '    name: ' src/demux/mp4_file_demux_oracle_cases_test.mbt)"

  demux-cli:
    name: demux-cli (native smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain versions
        run: moon version --all
      - name: Run demux example on checked-in fixtures
        run: |
          moon run src/examples/demux --target native -- tests/fixtures/upstream/black-h264-video.mp4
          moon run src/examples/demux --target native -- tests/fixtures/upstream/beep-aac-audio.mp4 --json --max-samples 3
          moon run src/examples/demux --target native -- tests/fixtures/upstream/beep-aac-audio.mp4 --max-samples 0
      - name: Verify exit codes for failure paths
        run: |
          moon run src/examples/demux --target native -- /does/not/exist.mp4 && exit 1; [ $? -eq 3 ]
          moon run src/examples/demux --target native -- README.md && exit 1; [ $? -eq 5 ]
          moon run src/examples/demux --target native -- tests/fixtures/upstream/black-h264-video.mp4 --buffer-size 100 && exit 1; [ $? -eq 4 ]

  web-build:
    name: web-build (browser demo bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build web demo bundle + static assets
        run: sh web/build.sh
      - name: Smoke-test the ESM bundle in Node
        run: |
          node --input-type=module -e '
            import * as mp4 from "./web/dist/mp4.js";
            const s = mp4.mp4dump_create("probe.mp4", 1635n, 0n);
            const req = JSON.parse(mp4.mp4dump_next_request(s));
            if (req.position !== "0" || req.size !== "32") throw new Error("bad first request");
            if (mp4.mp4dump_state(s) !== "walk") throw new Error("bad initial state");
            mp4.mp4dump_cancel(s);
            if (mp4.mp4dump_state(s) !== "cancelled") throw new Error("cancel failed");
            if (mp4.mp4dump_next_request(s) !== "") throw new Error("request after cancel");
            import * as tx from "./web/dist/transcode-core.js";
            const s = tx.webtranscode_create(640, 480, 1000000);
            if (tx.webtranscode_state(s) !== "ready") throw new Error("transcode state");
            tx.webtranscode_finalize(s);
            if (!tx.webtranscode_error_json(s).includes("sample entry")) throw new Error("transcode error");
            console.log("web bundle smoke: ok");
          '

  diff-lab:
    name: diff-lab (Rust/WASM vs MoonBit diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/lab-oracle/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build bundle + wasm oracle
        # rust-toolchain.toml (1.94.0 + wasm32-unknown-unknown target) is
        # resolved inside tools/lab-oracle by rustup automatically.
        run: sh web/build.sh
      - name: Run diff lab over all manifest fixtures
        run: node web/run_lab.mjs
      - name: Upload lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-lab-reports
          path: web/lab-out/
          if-no-files-found: warn
