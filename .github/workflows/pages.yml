name: Pages

# Deploys only artifacts that come out of a successful CI run on main.
# Builds the MoonBit JS-target bundle plus the static web/ assets into
# web/dist/ and deploys it to GitHub Pages.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web demo
    # Never deploy when the CI run failed. SKIP is not treated as success:
    # only conclusion == success proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: moon install
      - name: Build web demo (JS-target MoonBit core + static assets)
        run: sh web/build.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (limited to web/dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
