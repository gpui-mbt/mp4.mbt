name: Pages

# Deploys only artifacts that come out of a successful CI run on main.
# The web demo itself is implemented in issue 0015; until then this workflow
# skips the build with an explicit message instead of publishing anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web demo
    # Never deploy when the CI run failed. SKIP is not treated as success:
    # only conclusion == success proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build web demo (skip when not implemented yet)
        id: build
        run: |
          if [ ! -f src/web/moon.pkg ]; then
            echo "web demo is not implemented yet (issue 0015); nothing to deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          moon build --target js --release src/web
          if [ ! -d web/dist ]; then
            echo "::error::src/web exists but web/dist was not produced"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.build.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact (limited to web/dist)
        if: steps.build.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        if: steps.build.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
