<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mp4.mbt — WebCodecs transcode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>WebCodecs MP4 → MP4</h1>
    <p class="lead">
      ローカル MP4 をブラウザ内で decode / encode し、MoonBit の muxer で MP4 に
      まとめます。ファイルは外部へ送信しません。H.264 出力に対応します。
    </p>
  </header>
  <main>
    <section id="dropzone">
      <input id="file-input" type="file" accept="video/mp4,video/quicktime" />
      <button id="cancel-button" type="button" disabled>キャンセル</button>
      <p id="progress" aria-live="polite"></p>
      <p id="codec-status" class="muted"></p>
    </section>
    <section id="result-section" hidden>
      <h2>結果</h2>
      <dl id="result-info"></dl>
      <a id="download-link" download="transcoded.mp4">MP4 をダウンロード</a>
    </section>
    <section id="error-section" hidden>
      <h2>エラー</h2>
      <pre id="error-body"></pre>
    </section>
  </main>
  <script type="module" src="transcode.js"></script>
</body>
</html>
